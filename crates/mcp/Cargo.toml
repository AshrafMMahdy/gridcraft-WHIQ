[package]
name = "gridcraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[dependencies]
gridcraft-engine = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# WHIQ: auto-save on SIGTERM / SIGINT / SIGHUP (Ctrl-C, Ctrl-Break, console close on Windows).
ctrlc = { version = "3.4", features = ["termination"] }
