[package]
name = "gridcraft-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft's tiny PDF 1.7 writer (standard 14 fonts or, WHIQ, embedded subset fonts with shaping; vector drawing, RGBA images)"

[lints]
workspace = true

[dependencies]
# WHIQ: shaped text (Arabic, bidi) in embedded subset TrueType fonts.
gridcraft-text = { workspace = true }
subsetter = { version = "0.2.6", default-features = false, features = ["variable-fonts"] }
miniz_oxide = "0.8"
