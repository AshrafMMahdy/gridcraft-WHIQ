[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-pdf = { workspace = true }
# WHIQ: shaped text and the raster canvas (PNG renders).
gridcraft-text = { workspace = true }
gridcraft-raster = { workspace = true }
image = { workspace = true }

# WHIQ: the free space of the disk an export is about to fill (a stated refusal, not a full disk).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs4 = { version = "1.1", default-features = false, features = ["sync"] }

[dev-dependencies]
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
